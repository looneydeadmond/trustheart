experiment:
  name: smoke
  model:
    n_classes: 5
    use_apba: true
    use_paam: true
    use_ladl: true
  data:
    source: synthetic
    n_classes: 5
    per_class: 8
    train_fraction: 0.75
    seed: 1
  privacy:
    enabled: true
    total_epsilon: 4.2
    delta: 1.0e-5
    alpha: 0.5
    clip_percentile: 90.0
    coefficient: 1.0
  train:
    epochs: 1
    batch_size: 16
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
    max_steps: 2
    seed: 1
    device: cpu
    out_dir: runs/smoke

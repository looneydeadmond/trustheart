[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustheart"
version = "0.1.0"
description = "Privacy-preserving, explainable, adversary-aware ECG classification for consumer wearables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0,<2.10",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "wfdb>=4.1",
    "jsonargparse>=4.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
export = ["onnx>=1.15"]
dev = ["ruff", "black", "isort", "mypy", "pytest", "hypothesis"]

[project.scripts]
trustheart = "trustheart.console.run:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trustheart*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["trustheart"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["trustheart"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/trustheart"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "scipy.*",
    "sklearn.*",
    "wfdb.*",
    "onnx.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonargparse.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
